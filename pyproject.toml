[project]
name = "hans"
version = "0.1.0.dev0"
description = "Where the words are: pixel-anchored word geometry for ALTO, and the bench that judges it."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "hans contributors" }]
keywords = ["alto", "ocr", "htr", "forced-alignment", "ctc", "digital-heritage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# The BENCH is the base install, and it is deliberately light: lxml to read
# ALTO, nothing else. The bench must run in a CI that has no model, no
# network and no credentials — otherwise the autonomous loop has no engine
# it can trust (AUTOPILOT, "le juge tourne partout").
dependencies = [
    "lxml>=5.0",
]

[project.optional-dependencies]
# The CTC resolver. torch + kraken land HERE and nowhere else: G2 depends on
# H1 being answered first, and until it is, nothing in the base install may
# require a 2 GB wheel.
ctc = [
    "torch>=2.2",
    "kraken>=5.2",
    "pillow>=10.0",
    "numpy>=1.26",
]

# saknussemm is what the baseline resolver is a copy OF. The parity test
# (tests/test_baseline_is_saknussemms.py) pins the copy against the original
# and SKIPS when saknussemm is absent -- which is why CI can stay
# self-contained. See AUTOPILOT rule "une mesure prise sans la parite n'est
# pas une mesure".
parity = [
    "saknussemm",
]

test = ["pytest", "ruff", "mypy", "lxml-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hans"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/hans"]

# saknussemm is imported by name in bench.py and campaign.py (the --strict
# probe) and is not installable in CI: the package is unpublished. PIL is a
# lazy import in triage.py and is not in the [test] extra either. Without
# this, mypy has been red on main since 2026-09-25 (import-not-found).
[[tool.mypy.overrides]]
module = ["PIL.*", "saknussemm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
